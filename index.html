
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #10102c, #25255a);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 20px;
    width: 100%;
    max-width: 420px;
}

h1 {
    color: #00f5ff;
    font-size: 38px;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00f5ff;
}

.game-box {
    position: relative;
    display: inline-block;
    border: 4px solid #00f5ff;
    border-radius: 8px;
    box-shadow: 0 0 20px #00f5ff55;
    overflow: hidden;
}

canvas {
    display: block;
    background: #09091b;
    max-width: 100%;
}

.menu {
    position: absolute;
    inset: 0;
    background: rgba(8, 8, 30, 0.94);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.menu h2 {
    color: #00f5ff;
    font-size: 30px;
}

.menu p {
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 25px;
    margin: 6px;
    color: #10102c;
    background: #00f5ff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ff4de3;
    transform: scale(1.05);
}

.info {
    display: flex;
    justify-content: space-around;
    font-size: 17px;
    margin: 12px 0;
}

.controls {
    margin-top: 12px;
}

.controls button {
    min-width: 52px;
    padding: 12px;
}

small {
    color: #c8c8ef;
}
</style>
</head>

<body>
<div class="container">
    <h1>TETRIS</h1>

    <div class="info">
        <span>SKOR: <b id="score">0</b></span>
        <span>LEVEL: <b id="level">1</b></span>
    </div>

    <div class="game-box">
        <canvas id="game" width="300" height="600"></canvas>

        <div class="menu" id="menu">
            <h2 id="menuTitle">TETRIS GAME</h2>
            <p id="menuText">
                Susun balok dan lengkapi garis!<br>
                Gunakan keyboard atau tombol kontrol.
            </p>
            <button id="startBtn" onclick="startGame()">
                ▶ START GAME
            </button>
        </div>
    </div>

    <div class="controls">
        <button onclick="move(-1)">◀</button>
        <button onclick="rotate()">↻</button>
        <button onclick="move(1)">▶</button>
        <button onclick="drop()">▼</button>
        <button onclick="togglePause()">Ⅱ</button>
    </div>

    <p><small>
        ← → Gerak | ↑ Putar | ↓ Turun | Spasi Jatuhkan
    </small></p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const colors = [
    null, "#00f5ff", "#3568ff", "#ff9f43",
    "#ffe44d", "#b44dff", "#55ff88", "#ff4d75"
];

const shapes = [
    [],
    [[1,1,1,1]],
    [[2,0,0],[2,2,2]],
    [[0,0,3],[3,3,3]],
    [[4,4],[4,4]],
    [[0,5,0],[5,5,5]],
    [[0,6,6],[6,6,0]],
    [[7,7,0],[0,7,7]]
];

let board;
let piece;
let score = 0;
let level = 1;
let running = false;
let paused = false;
let lastTime = 0;
let dropCounter = 0;
let animationId = null;

function createBoard() {
    return Array.from({length: ROWS},
        () => Array(COLS).fill(0));
}

function newPiece() {
    const id = Math.floor(Math.random() * 7) + 1;
    const matrix = shapes[id].map(row => [...row]);

    return {
        matrix,
        x: Math.floor((COLS - matrix[0].length) / 2),
        y: 0
    };
}

function drawBlock(x, y, id) {
    ctx.fillStyle = colors[id];
    ctx.fillRect(x * SIZE, y * SIZE, SIZE - 1, SIZE - 1);

    ctx.strokeStyle = "#ffffff55";
    ctx.strokeRect(x * SIZE + 2, y * SIZE + 2,
        SIZE - 5, SIZE - 5);
}

function drawMatrix(matrix, offsetX, offsetY) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                drawBlock(x + offsetX, y + offsetY, value);
            }
        });
    });
}

function draw() {
    ctx.fillStyle = "#09091b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Garis kotak
    ctx.strokeStyle = "#ffffff10";
    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * SIZE, 0);
        ctx.lineTo(x * SIZE, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * SIZE);
        ctx.lineTo(canvas.width, y * SIZE);
        ctx.stroke();
    }

    if (board) drawMatrix(board, 0, 0);
    if (piece) drawMatrix(piece.matrix, piece.x, piece.y);
}

function collide() {
    return piece.matrix.some((row, y) =>
        row.some((value, x) => {
            if (!value) return false;

            const nx = piece.x + x;
            const ny = piece.y + y;

            return nx < 0 || nx >= COLS ||
                   ny >= ROWS ||
                   (ny >= 0 && board[ny][nx] !== 0);
        })
    );
}

function merge() {
    piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                const by = piece.y + y;
                const bx = piece.x + x;

                if (by >= 0) board[by][bx] = value;
            }
        });
    });
}

function clearLines() {
    let lines = 0;

    for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every(value => value !== 0)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(0));
            lines++;
            y++;
        }
    }

    if (lines > 0) {
        score += [0, 100, 300, 500, 800][lines] * level;
        level = Math.floor(score / 1000) + 1;

        document.getElementById("score").textContent = score;
        document.getElementById("level").textContent = level;
    }
}

function spawnPiece() {
    piece = newPiece();

    if (collide()) {
        endGame();
    }
}

function stepDown() {
    piece.y++;

    if (collide()) {
        piece.y--;
        merge();
        clearLines();
        spawnPiece();
    }
}

function move(direction) {
    if (!running || paused || !piece) return;

    piece.x += direction;
    if (collide()) piece.x -= direction;
    draw();
}

function rotate() {
    if (!running || paused || !piece) return;

    const old = piece.matrix;
    piece.matrix = old[0].map((_, i) =>
        old.map(row => row[i]).reverse()
    );

    if (collide()) piece.matrix = old;
    draw();
}

function drop() {
    if (!running || paused || !piece) return;

    do {
        piece.y++;
    } while (!collide());

    piece.y--;
    merge();
    clearLines();
    spawnPiece();
    draw();
}

function startGame() {
    if (animationId !== null) {
        cancelAnimationFrame(animationId);
    }

    board = createBoard();
    score = 0;
    level = 1;
    dropCounter = 0;
    lastTime = 0;
    running = true;
    paused = false;

    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("menu").style.display = "none";

    spawnPiece();
    draw();

    if (running) {
        animationId = requestAnimationFrame(update);
    }
}

function togglePause() {
    if (!running) return;

    paused = !paused;

    if (paused) {
        document.getElementById("menuTitle").textContent = "PAUSED";
        document.getElementById("menuText").textContent =
            "Game dijeda. Siap melanjutkan?";
        document.getElementById("startBtn").textContent =
            "▶ LANJUTKAN";
        document.getElementById("startBtn").onclick = resumeGame;
        document.getElementById("menu").style.display = "flex";
    } else {
        resumeGame();
    }
}

function resumeGame() {
    paused = false;
    document.getElementById("menu").style.display = "none";
    lastTime = 0;
    animationId = requestAnimationFrame(update);
}

function endGame() {
    running = false;
    paused = false;

    document.getElementById("menuTitle").textContent = "GAME OVER";
    document.getElementById("menuText").textContent =
        "Skor akhir kamu: " + score;
    document.getElementById("startBtn").textContent =
        "↻ MAIN LAGI";
    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("menu").style.display = "flex";
}

function update(time = 0) {
    if (!running || paused) return;

    const delta = lastTime ? time - lastTime : 0;
    lastTime = time;
    dropCounter += delta;

    const speed = Math.max(100, 800 - (level - 1) * 70);

    if (dropCounter > speed) {
        stepDown();
        dropCounter = 0;
    }

    draw();

    if (running && !paused) {
        animationId = requestAnimationFrame(update);
    }
}

document.addEventListener("keydown", event => {
    if (event.code === "ArrowLeft") {
        event.preventDefault();
        move(-1);
    } else if (event.code === "ArrowRight") {
        event.preventDefault();
        move(1);
    } else if (event.code === "ArrowDown") {
        event.preventDefault();

        if (running && !paused) {
            stepDown();
            draw();
        }
    } else if (event.code === "ArrowUp") {
        event.preventDefault();
        rotate();
    } else if (event.code === "Space") {
        event.preventDefault();
        drop();
    } else if (event.code === "Escape" || event.code === "KeyP") {
        togglePause();
    }
});

board = createBoard();
draw();
</script>
</body>
</html>
